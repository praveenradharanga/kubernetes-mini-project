<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS Pro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Employee Management System</h1>
    <p>Kubernetes Mini Project</p>
</header>

<div class="status">

    <div id="frontend-status">
        Frontend :
        <span class="running">🟢 Running</span>
    </div>

    <div id="backend-status">
        Backend :
        <span class="loading">🟡 Checking...</span>
    </div>

    <div id="database-status">
        Database :
        <span class="loading">🟡 Coming Soon</span>
    </div>

</div>

<h2>Employees</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Department</th>
</tr>
</thead>

<tbody id="employee-table">

</tbody>

</table>

<script src="app.js"></script>

</body>
</html>
